<section class="max-w-7xl mx-auto px-6 py-12"><h1 class="font-serif text-3xl mb-6">Tìm salon</h1><form (ngSubmit)="search()" class="flex gap-3 mb-6"><input [(ngModel)]="keyword" name="keyword" aria-label="Tên salon hoặc địa điểm" placeholder="Tên salon, thành phố hoặc quận" class="border rounded-lg px-4 py-3 flex-1 min-w-0"><button type="submit" class="bg-[#915B63] text-white rounded-lg px-6">Tìm kiếm</button></form>
@if(loading()){<p role="status">Đang tải…</p>}@else if(error()){<p role="alert">{{ error() }} <button (click)="load(page())" class="underline">Thử lại</button></p>}@else{<p class="mb-6">{{ total() }} salon</p><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">@for(salon of salons();track salon.id){<app-salon-card [salon]="salon"/>}@empty{<p>Không tìm thấy salon phù hợp.</p>}</div><div class="flex justify-center items-center gap-4 mt-8"><button (click)="load(page()-1)" [disabled]="page()===0" class="disabled:opacity-40">Trang trước</button><span>Trang {{ page()+1 }}</span><button (click)="load(page()+1)" [disabled]="last()" class="disabled:opacity-40">Trang sau</button></div>}</section>
